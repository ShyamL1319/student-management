
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: school-management-backend:latest
    container_name: school-management-backend-prod
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - PORT=3000
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "{{.Name}}/{{.ID}}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: school-management-frontend:latest
    container_name: school-management-frontend-prod
    ports:
      - '80:80'
    environment:
      - VITE_API_URL=${VITE_API_URL}
    restart: always
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "{{.Name}}/{{.ID}}"
